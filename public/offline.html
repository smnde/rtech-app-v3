<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — RS Retail</title>
    <style>
        :root { color-scheme: light dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            padding: 24px; text-align: center;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb; color: #111827;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #030712; color: #f9fafb; }
            .muted { color: #9ca3af !important; }
        }
        .icon {
            display: flex; align-items: center; justify-content: center;
            width: 72px; height: 72px; border-radius: 999px;
            background: #eef2ff; color: #4f46e5;
        }
        @media (prefers-color-scheme: dark) {
            .icon { background: rgba(79, 70, 229, .15); color: #818cf8; }
        }
        h1 { font-size: 20px; font-weight: 700; }
        p { max-width: 34ch; font-size: 14px; line-height: 1.6; color: #4b5563; }
        .muted { color: #4b5563; }
        button {
            margin-top: 6px; padding: 10px 20px; border: 0; border-radius: 10px;
            font-size: 14px; font-weight: 600; color: #fff; background: #4f46e5;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.55a11 11 0 0 1 5.17-3.06M1.42 9a16 16 0 0 1 4.26-2.71M10.71 5.05a16 16 0 0 1 11.87 3.95M19.5 16.5a5 5 0 0 1-1.4.9"/>
        </svg>
    </div>
    <h1>Tidak ada koneksi</h1>
    <p class="muted">Aplikasi butuh internet untuk memuat data transaksi. Periksa jaringan lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
    <script>
        // Begitu jaringan kembali, langsung muat ulang tanpa menunggu user.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
